  <script>
    // Initialize forge editor directly
    window.addEventListener('DOMContentLoaded', function(){
      // console.log('DOM loaded, starting forge initialization...');
      
      // Set forge flag
      window.ENABLE_FORGE = true;
      // console.log('ENABLE_FORGE set to:', window.ENABLE_FORGE);
      
      // // Check if required objects exist
      // console.log('gfx object:', window.gfx);
      // console.log('forge object:', window.forge);
      
      // Initialize graphics first
      if (window.gfx && window.gfx.init) {
        // console.log('Initializing graphics...');
        try {
          gfx.init();
          // console.log('Graphics initialized successfully');
          
          // Wait for scene to be ready, then initialize forge
          if (gfx.scene && gfx.scene.whenReadyAsync) {
            // console.log('Waiting for scene to be ready...');
            gfx.scene.whenReadyAsync().then(function() {
              // console.log('Scene ready, initializing forge...');
              if (window.forge && window.forge.init) {
                forge.init();
                console.log('Forge editor ready!');
              } else {
                // console.error('Forge object not found or init method missing');
              }
            }).catch(function(error) {
              // console.error('Error waiting for scene:', error);
            });
          } else {
            // console.error('Scene or whenReadyAsync not available');
          }
        } catch (error) {
          // console.error('Error initializing graphics:', error);
        }
      } else {
        // console.error('Graphics system not found or init method missing');
      }
    });
  </script>
