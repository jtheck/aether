<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTXX Pointer Test</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        
        .container {
            display: flex;
            gap: 20px;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .test-area {
            flex: 1;
            background: #2f3542;
            border: 2px solid #5352ed;
            border-radius: 10px;
            position: relative;
            min-height: 400px;
        }
        
        .test-square {
            position: absolute;
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #ff4757, #5352ed);
            border: 3px solid #fff;
            border-radius: 10px;
            cursor: grab;
            user-select: none;
            transition: transform 0.1s ease;
            pointer-events: auto;
        }
        
        .test-square:active {
            cursor: grabbing;
        }
        
        .test-square:nth-child(2) {
            background: linear-gradient(45deg, #2ed573, #ffa502);
            top: 20%;
            left: 20%;
            transform: translate(-50%, -50%);
        }
        
        .test-square:nth-child(3) {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            top: 80%;
            left: 80%;
            transform: translate(-50%, -50%);
        }
        
        .test-square:nth-child(4) {
            background: linear-gradient(45deg, #a55eea, #fd79a8);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .pointer-indicator {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ff6b6b;
            border-radius: 50%;
            border: 2px solid #fff;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1000;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #5352ed;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            z-index: 100;
        }
        
        .copy-btn:hover {
            background: #3742fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="test-area" id="testArea">
            <h2>Test Area - Multi-touch Gestures</h2>
            <div class="test-square" id="testSquare1">
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; text-align: center; font-size: 12px;">
                    SQUARE 1<br>DRAG/ROTATE/SCALE
                </div>
            </div>
            <div class="test-square" id="testSquare2">
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; text-align: center; font-size: 12px;">
                    SQUARE 2<br>DRAG/ROTATE/SCALE
                </div>
            </div>
            <div class="test-square" id="testSquare3">
                <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-weight: bold; text-align: center; font-size: 12px;">
                    SQUARE 3<br>DRAG/ROTATE/SCALE
                </div>
            </div>
        </div>
    </div>
    
    <button class="copy-btn" id="testPointer">🧪 Test Pointer</button>

    <script src="vendor/ftxx_pointer.js"></script>
    <script>
        class SimpleFTXXTest {
            constructor() {
                this.testArea = document.getElementById('testArea');
                this.testSquare1 = document.getElementById('testSquare1');
                this.testSquare2 = document.getElementById('testSquare2');
                this.testSquare3 = document.getElementById('testSquare3');
                
                // Individual transform states for each square
                this.squareTransforms = {
                    testSquare1: { x: 0, y: 0, scale: 1, rotation: 0 },
                    testSquare2: { x: 0, y: 0, scale: 1, rotation: 0 },
                    testSquare3: { x: 0, y: 0, scale: 1, rotation: 0 }
                };
                
                // Track active pointers and which gesture group they belong to
                this.activePointers = new Set();
                this.pointerToGestureGroup = new Map(); // Maps pointer ID to gesture group ID
                this.pointerToFingerNumber = new Map(); // Maps pointer ID to finger number
                this.usedFingerNumbers = new Set(); // Track which numbers are currently in use
                
                // Track gesture state per group ID
                this.gestureStates = new Map();
                

                
                this.initFTXX();
                this.setupEventListeners();
                this.setupTestPointerButton();
                this.setupSquareEventPrevention();
            }
            
            initFTXX() {
                if (!window.ftxxPointer) {
                    return;
                }
                
                // Initialize FTXX with our improved settings
                window.ftxxPointer.init({
                    debug: false,  // Disable debug mode to reduce console spam
                    preventDefault: true,
                    passive: false,
                    gestureThresholds: { 
                        pan: 1.0,      // Neutral baseline
                        rotation: 1.0,  // Neutral baseline
                        zoom: 1.0       // Neutral baseline
                    },
                    gestureSensitivity: {
                        pan: 1.0,      // Neutral baseline
                        rotation: 1.0,  // Neutral baseline
                        zoom: 1.0       // Neutral baseline
                    }
                });
                
                // Clear any existing gesture state
                window.ftxxPointer.clearGestureState();
                

                
                // Set up gesture start validation
                window.ftxxPointer.onGestureStart((gestureData) => {
                    const squares = [
                        { id: 'testSquare1', element: this.testSquare1 },
                        { id: 'testSquare2', element: this.testSquare2 },
                        { id: 'testSquare3', element: this.testSquare3 }
                    ];
                    
                    const hitSquares = new Set();
                    
                    // Check direct touches
                    for (const touch of gestureData.touches) {
                        for (const square of squares) {
                            if (this.isPointInSquare(touch.x, touch.y, square.element)) {
                                hitSquares.add(square);
                            }
                        }
                    }
                    
                    // Check center point if no direct hits
                    if (hitSquares.size === 0) {
                        for (const square of squares) {
                            if (this.isPointInSquare(gestureData.center.x, gestureData.center.y, square.element)) {
                                hitSquares.add(square);
                            }
                        }
                    }
                    
                    // Check proximity if no direct hits or center hits
                    if (hitSquares.size === 0) {
                        for (const square of squares) {
                            if (this.isPointNearSquare(gestureData.center.x, gestureData.center.y, square.element, 50)) {
                                hitSquares.add(square);
                            }
                        }
                    }
                    
                    // Always allow the gesture to be created, even if it doesn't hit squares
                    // This prevents the library from clearing existing gestures when new touches are added
                    return {
                        keep: true, // Always keep the gesture
                        targets: Array.from(hitSquares)
                    };
                });
            }
            

            
            setupEventListeners() {
                // Listen for events on the test area
                window.ftxxPointer.on(this.testArea, 'pointerdown', (evt) => {
                    this.handlePointerEvent('POINTERDOWN', evt);
                });
                
                window.ftxxPointer.on(this.testArea, 'pointerup', (evt) => {
                    this.handlePointerEvent('POINTERUP', evt);
                });
                
                window.ftxxPointer.on(this.testArea, 'pointermove', (evt) => {
                    this.handlePointerEvent('POINTERMOVE', evt);
                });
                
                // Unified transform event (combines pan, pinch, rotate)
                window.ftxxPointer.on(this.testArea, 'transform', (evt) => {
                    this.handleTransform(evt);
                });
                
                // Note: We only listen to events on the test area to avoid duplicate events
                // The squares will still receive events through event bubbling
                

                

            }
            
            // Handle unified transform events (combines pan, pinch, rotate)
            handleTransform(evt) {
                if (evt.targets && evt.targets.length > 0) {
                    console.log(`TRANSFORM: Gesture detected - ${evt.targets.length} square(s) affected`);
                    if (evt.deltaX !== 0 || evt.deltaY !== 0) console.log(`  Pan: (${evt.deltaX.toFixed(2)}, ${evt.deltaY.toFixed(2)})`);
                    if (evt.deltaScale !== 1) console.log(`  Scale: ${evt.deltaScale.toFixed(2)}`);
                    if (evt.deltaRotation !== 0) console.log(`  Rotation: ${(evt.deltaRotation * 180 / Math.PI).toFixed(1)}°`);
                    // Get the pointers for this gesture group from the library
                    const gestureTargets = window.ftxxPointer.getGestureTargets(evt.groupId);
                    const gestureGroup = window.ftxxPointer._state.gestureGroups.get(evt.groupId);
                    
                    if (gestureGroup && gestureGroup.pointerIds) {
                        // Track which pointers belong to this gesture group
                        gestureGroup.pointerIds.forEach(pointerId => {
                            this.pointerToGestureGroup.set(pointerId, evt.groupId);
                        });
                    }
                    
                    // Create gesture group indicator with actual pointer IDs
                    const pointerIds = gestureGroup ? gestureGroup.pointerIds : [];
                    this.updateGestureGroupIndicator(evt.groupId, pointerIds, evt.targets, evt);
                    
                    evt.targets.forEach(target => {
                        this.handleTransformForSquare(evt, target.id);
                    });
                    
                    this.updateHighlightsForAllGestures();
                }
            }
            
            // Handle unified transform for a square
            handleTransformForSquare(evt, squareId) {
                const transform = this.squareTransforms[squareId];
                if (!this.baseScales) {
                    this.baseScales = {
                        testSquare1: 1,
                        testSquare2: 1,
                        testSquare3: 1
                    };
                }
                // --- ABSOLUTE POSITIONING LOGIC ---
                // Track per-group offset between box and gesture center
                const groupId = evt.groupId;
                if (!this.gestureStates.has(groupId)) {
                    this.gestureStates.set(groupId, { offsets: {} });
                }
                const gestureState = this.gestureStates.get(groupId);
                if (!gestureState.offsets[squareId]) {
                    // On first transform for this group, record offset
                    gestureState.offsets[squareId] = {
                        x: (transform.x || 0) - (evt.centerX || 0),
                        y: (transform.y || 0) - (evt.centerY || 0)
                    };
                }
                // Set position to gesture center + initial offset
                if (evt.centerX !== undefined && evt.centerY !== undefined) {
                    const offset = gestureState.offsets[squareId];
                    transform.x = evt.centerX + offset.x;
                    transform.y = evt.centerY + offset.y;
                }
                // --- SCALE ---
                if (evt.deltaScale !== 1) {
                    this.baseScales[squareId] *= evt.deltaScale;
                    this.baseScales[squareId] = Math.max(0.5, Math.min(3, this.baseScales[squareId]));
                    transform.scale = this.baseScales[squareId];
                }
                // --- ROTATION ---
                if (evt.deltaRotation !== 0) {
                    transform.rotation = (transform.rotation || 0) + evt.deltaRotation;
                }
                this.updateSquareTransform(squareId);
            }

            
            // Update the visual transform of a square
            updateSquareTransform(squareId) {
                const transform = this.squareTransforms[squareId];
                const squareElement = document.getElementById(squareId);
                
                if (squareElement) {
                    const transformString = `translate(${transform.x}px, ${transform.y}px) scale(${transform.scale}) rotate(${transform.rotation}rad)`;
                    squareElement.style.transform = transformString;
                }
            }
            
            // Create a visual indicator for a pointer/touch point
            createPointerIndicator(pointer) {
                // Only remove if it already exists
                const existingIndicator = document.getElementById(`pointer-${pointer.id}`);
                if (existingIndicator) {
                    existingIndicator.remove();
                }
                
                const indicator = document.createElement('div');
                indicator.id = `pointer-${pointer.id}`;
                indicator.className = 'pointer-indicator';
                indicator.style.left = pointer.x + 'px';
                indicator.style.top = pointer.y + 'px';
                indicator.style.backgroundColor = '#ff6b6b';
                indicator.style.width = '30px';
                indicator.style.height = '30px';
                indicator.style.borderRadius = '50%';
                indicator.style.border = '3px solid #fff';
                indicator.style.position = 'fixed';
                indicator.style.pointerEvents = 'none';
                indicator.style.zIndex = '10000';
                indicator.style.transform = 'translate(-50%, -50%)';
                
                const label = document.createElement('div');
                label.style.position = 'absolute';
                label.style.top = '-30px';
                label.style.left = '50%';
                label.style.transform = 'translateX(-50%)';
                label.style.color = '#fff';
                label.style.fontSize = '14px';
                label.style.fontWeight = 'bold';
                label.style.textShadow = '2px 2px 4px rgba(0,0,0,0.8)';
                label.style.backgroundColor = 'rgba(0,0,0,0.7)';
                label.style.padding = '2px 6px';
                label.style.borderRadius = '4px';
                const fingerNumber = this.pointerToFingerNumber.get(pointer.id) || '?';
                label.textContent = `Finger ${fingerNumber}`;
                indicator.appendChild(label);
                
                document.body.appendChild(indicator);
            }
            
            // Remove a pointer indicator
            removePointerIndicator(pointerId) {
                const indicator = document.getElementById(`pointer-${pointerId}`);
                if (indicator) {
                    indicator.remove();
                }
            }
            
            // Update a pointer indicator position
            updatePointerIndicator(pointer) {
                const indicator = document.getElementById(`pointer-${pointer.id}`);
                if (indicator) {
                    indicator.style.left = pointer.x + 'px';
                    indicator.style.top = pointer.y + 'px';
                }
            }
            
            // Update gesture group indicator
            updateGestureGroupIndicator(groupId, pointerIds, activeSquares, evt) {
                // Check if we already have a gesture group indicator for this group
                const existingIndicator = document.getElementById(`gesture-group-${groupId}`);
                if (existingIndicator) {
                    // Update the existing indicator position to follow the gesture center
                    if (evt.centerX !== undefined && evt.centerY !== undefined) {
                        existingIndicator.style.left = evt.centerX + 'px';
                        existingIndicator.style.top = evt.centerY + 'px';
                    }
                    return;
                }
                
                // For transform events, we might not have pointerIds, so we'll use the gesture center
                if (!pointerIds || pointerIds.length < 2) {
                    // If we have a gesture center, we can still show the indicator
                    if (evt.centerX !== undefined && evt.centerY !== undefined) {
                        this.updateOrCreateGestureIndicator(groupId, evt.centerX, evt.centerY, evt);
                    }
                    return;
                }
                
                // Use the gesture center from the event data
                let centerX, centerY;
                if (evt.centerX !== undefined && evt.centerY !== undefined) {
                    centerX = evt.centerX;
                    centerY = evt.centerY;
                } else {
                    // Fallback: calculate center from pointer positions
                    const pointers = [];
                    pointerIds.forEach(id => {
                        const indicator = document.getElementById(`pointer-${id}`);
                        if (indicator) {
                            const x = parseFloat(indicator.style.left);
                            const y = parseFloat(indicator.style.top);
                            if (!isNaN(x) && !isNaN(y)) {
                                pointers.push({ x, y });
                            }
                        }
                    });
                    
                    if (pointers.length < 2) {
                        // Fallback: create a circle at a reasonable position
                        centerX = window.innerWidth / 2;
                        centerY = window.innerHeight / 2;
                    } else {
                        centerX = pointers.reduce((sum, p) => sum + p.x, 0) / pointers.length;
                        centerY = pointers.reduce((sum, p) => sum + p.y, 0) / pointers.length;
                    }
                }
                
                // Use a fixed radius for the gesture center indicator
                const radius = 80;
                
                this.createGestureGroupCircle(groupId, centerX, centerY, radius, pointerIds || []);
            }
            
            // Helper method for transform events
            updateOrCreateGestureIndicator(groupId, centerX, centerY, evt) {
                const existingIndicator = document.getElementById(`gesture-group-${groupId}`);
                if (existingIndicator) {
                    existingIndicator.style.left = centerX + 'px';
                    existingIndicator.style.top = centerY + 'px';
                    return;
                }
                
                // Get pointer count from the gesture group
                const gestureGroup = window.ftxxPointer._state.gestureGroups.get(groupId);
                const pointerIds = gestureGroup ? gestureGroup.pointerIds : [];
                
                const radius = 80;
                this.createGestureGroupCircle(groupId, centerX, centerY, radius, pointerIds);
            }
            
            // Create the actual gesture group circle
            createGestureGroupCircle(groupId, centerX, centerY, radius, pointerIds) {
                // Create gesture group indicator
                const indicator = document.createElement('div');
                indicator.id = `gesture-group-${groupId}`;
                indicator.style.position = 'fixed';
                indicator.style.left = centerX + 'px';
                indicator.style.top = centerY + 'px';
                indicator.style.width = (radius * 2) + 'px';
                indicator.style.height = (radius * 2) + 'px';
                indicator.style.borderRadius = '50%';
                indicator.style.border = '3px solid #00ff00';
                indicator.style.backgroundColor = 'rgba(0, 255, 0, 0.1)';
                indicator.style.transform = 'translate(-50%, -50%)';
                indicator.style.pointerEvents = 'none';
                indicator.style.zIndex = '9999';
                
                // Add a label showing the group ID and pointer count
                const label = document.createElement('div');
                label.style.position = 'absolute';
                label.style.top = '-30px';
                label.style.left = '50%';
                label.style.transform = 'translateX(-50%)';
                label.style.color = '#00ff00';
                label.style.fontSize = '12px';
                label.style.fontWeight = 'bold';
                label.style.textShadow = '2px 2px 4px rgba(0,0,0,0.8)';
                label.style.backgroundColor = 'rgba(0,0,0,0.7)';
                label.style.padding = '2px 6px';
                label.style.borderRadius = '4px';
                label.textContent = `Group ${groupId} (${pointerIds.length} fingers)`;
                indicator.appendChild(label);
                
                // Add animation to make it more visible
                indicator.style.animation = 'pulse 1s infinite';
                indicator.style.boxShadow = '0 0 20px #00ff00, 0 0 40px #00ff00';
                
                document.body.appendChild(indicator);
            }
            
            // Remove gesture group indicator
            removeGestureGroupIndicator(groupId) {
                const indicator = document.getElementById(`gesture-group-${groupId}`);
                if (indicator) {
                    indicator.remove();
                }
            }
            

            
            // Update highlights for all active gestures
            updateHighlightsForAllGestures() {
                const squaresToHighlight = new Set();
                
                // Get all active gesture groups from FTXX
                const activeGroupIds = window.ftxxPointer.getActiveGestureGroups();
                
                activeGroupIds.forEach(groupId => {
                    const gestureTargets = window.ftxxPointer.getGestureTargets(groupId);
                    gestureTargets.forEach(target => {
                        if (target && target.id) {
                            squaresToHighlight.add(target.id);
                        }
                    });
                });
                
                // Reset all squares to normal appearance
                const allSquares = [this.testSquare1, this.testSquare2, this.testSquare3];
                allSquares.forEach(square => {
                    square.style.boxShadow = '';
                    square.style.border = '3px solid #fff';
                });
                
                // Highlight all squares that are being gestured
                squaresToHighlight.forEach(squareId => {
                    const squareElement = document.getElementById(squareId);
                    if (squareElement) {
                        squareElement.style.boxShadow = '0 0 20px #00ff00, 0 0 40px #00ff00';
                        squareElement.style.border = '3px solid #00ff00';
                    }
                });
                
                // Clean up gesture group indicators for groups that no longer exist
                this.cleanupGestureGroupIndicators(activeGroupIds);
            }
            
            // Clean up gesture group indicators for groups that no longer exist
            cleanupGestureGroupIndicators(activeGroupIds) {
                const activeGroupIdsSet = new Set(activeGroupIds);
                const existingIndicators = document.querySelectorAll('[id^="gesture-group-"]');
                
                existingIndicators.forEach(indicator => {
                    const groupId = indicator.id.replace('gesture-group-', '');
                    if (!activeGroupIdsSet.has(parseInt(groupId))) {
                        console.log(`Removing gesture group indicator for inactive group ${groupId}`);
                        indicator.remove();
                    }
                });
            }
            

            
            // Clear square highlights when gestures end
            clearSquareHighlights() {
                const allSquares = [this.testSquare1, this.testSquare2, this.testSquare3];
                allSquares.forEach(square => {
                    square.style.boxShadow = '';
                    square.style.border = '3px solid #fff';
                });
                
                // Clear gesture group indicators
                const gestureGroups = document.querySelectorAll('[id^="gesture-group-"]');
                gestureGroups.forEach(group => {
                    group.remove();
                });
                
                this.gestureStates.clear();
            }
            
            // Prevent default events on squares
            setupSquareEventPrevention() {
                const allSquares = [this.testSquare1, this.testSquare2, this.testSquare3];
                allSquares.forEach(square => {
                    square.addEventListener('dragstart', (e) => e.preventDefault());
                    square.addEventListener('mousedown', (e) => e.preventDefault());
                    square.addEventListener('selectstart', (e) => e.preventDefault());
                });
            }
            
            setupTestPointerButton() {
                const testPointerBtn = document.getElementById('testPointer');
                testPointerBtn.addEventListener('click', () => {
                    this.clearAllPointerIndicators();
                    
                    const testPointer = {
                        id: 'test_' + Date.now(),
                        x: 200,
                        y: 200
                    };
                    this.createPointerIndicator(testPointer);
                    
                    setTimeout(() => {
                        this.removePointerIndicator(testPointer.id);
                    }, 3000);
                });
                
                // Add FTXX debug button
                const ftxxDebugBtn = document.createElement('button');
                ftxxDebugBtn.textContent = '🔍 FTXX State';
                ftxxDebugBtn.style.position = 'fixed';
                ftxxDebugBtn.style.top = '100px';
                ftxxDebugBtn.style.right = '10px';
                ftxxDebugBtn.style.zIndex = '1000';
                ftxxDebugBtn.addEventListener('click', () => {
                    const state = window.ftxxPointer.getPointerState();
                    console.log('=== FTXX POINTER STATE ===');
                    console.log('Active pointers:', state.pointers);
                    console.log('Pointer count:', state.pointerCount);
                    console.log('Gesture groups:', state.gestureGroups);
                    console.log('Tap start:', state.tapStart);
                    console.log('========================');
                });
                document.body.appendChild(ftxxDebugBtn);
                
                // Add reset button
                const resetBtn = document.createElement('button');
                resetBtn.textContent = '🔄 Reset Pointers';
                resetBtn.style.position = 'fixed';
                resetBtn.style.top = '140px';
                resetBtn.style.right = '10px';
                resetBtn.style.zIndex = '1000';
                resetBtn.addEventListener('click', () => {
                    console.log('=== RESETTING POINTER STATE ===');
                    this.clearAllPointers();
                    console.log('=== POINTER STATE RESET ===');
                });
                document.body.appendChild(resetBtn);
            }
            
            // Clear all pointer indicators
            clearAllPointerIndicators() {
                const indicators = document.querySelectorAll('.pointer-indicator');
                indicators.forEach(indicator => {
                    indicator.remove();
                });
                
                // Clear gesture group indicators
                const gestureGroups = document.querySelectorAll('[id^="gesture-group-"]');
                gestureGroups.forEach(group => {
                    group.remove();
                });
                
                this.activePointers.clear();
            }
            

            
            handlePointerEvent(type, evt) {
                if (type === 'POINTERDOWN') {
                    // POINTERDOWN: Add new pointers to tracking
                    evt.pointers.forEach(pointer => {
                        const pointerId = pointer.id.toString();
                        
                        // Don't add if already tracking this pointer
                        if (this.activePointers.has(pointerId)) {
                            this.updatePointerIndicator(pointer);
                            return;
                        }
                        
                        // Add new pointer to tracking
                        this.activePointers.add(pointerId);
                        
                        // Find the next available finger number
                        let fingerNumber = 1;
                        while (this.usedFingerNumbers.has(fingerNumber)) {
                            fingerNumber++;
                        }
                        this.usedFingerNumbers.add(fingerNumber);
                        this.pointerToFingerNumber.set(pointerId, fingerNumber);
                        
                        this.createPointerIndicator(pointer);
                        console.log(`POINTERDOWN: Touch detected at (${Math.round(pointer.x)}, ${Math.round(pointer.y)})`);
                    });
                    
                } else if (type === 'POINTERUP') {
                    // POINTERUP: Simple cleanup - just remove the pointers that were lifted
                    evt.pointers.forEach(pointer => {
                        const pointerId = pointer.id.toString();
                                            if (this.activePointers.has(pointerId)) {
                        this.activePointers.delete(pointerId);
                        this.removePointerIndicator(pointerId);
                        this.pointerToGestureGroup.delete(pointerId);
                        const fingerNumber = this.pointerToFingerNumber.get(pointerId);
                        if (fingerNumber) {
                            this.usedFingerNumbers.delete(fingerNumber);
                            this.pointerToFingerNumber.delete(pointerId);
                        }
                        console.log(`POINTERUP: Touch released at (${Math.round(pointer.x)}, ${Math.round(pointer.y)})`);
                    }
                });
                
                if (this.activePointers.size === 0) {
                    console.log(`POINTERUP: All touches released`);
                } else {
                    console.log(`POINTERUP: ${this.activePointers.size} touches still active`);
                }
                    
                    // Clean up invalid gesture groups
                    window.ftxxPointer.cleanupInvalidGestureGroups();
                    
                    // Update highlights
                    if (this.activePointers.size === 0) {
                        this.clearSquareHighlights();
                        this.gestureStates.clear();
                        this.pointerToGestureGroup.clear();
                    } else {
                        this.updateHighlightsForAllGestures();
                    }
                    
                } else if (type === 'POINTERMOVE') {
                    // POINTERMOVE: Update positions of tracked pointers
                    evt.pointers.forEach(pointer => {
                        const pointerId = pointer.id.toString();
                        if (this.activePointers.has(pointerId)) {
                            this.updatePointerIndicator(pointer);
                        }
                    });
                }
            }
            
            // Clear all pointers and indicators
            clearAllPointers() {
                console.log('Clearing all pointers and indicators');
                this.activePointers.forEach(pointerId => {
                    this.removePointerIndicator(pointerId);
                });
                this.activePointers.clear();
                this.pointerToGestureGroup.clear();
                this.gestureStates.clear();
                this.clearSquareHighlights();
                
                // Clear all visual indicators
                const indicators = document.querySelectorAll('.pointer-indicator');
                indicators.forEach(indicator => indicator.remove());
                
                const gestureGroups = document.querySelectorAll('[id^="gesture-group-"]');
                gestureGroups.forEach(group => group.remove());
                
                // Force FTXX to reset its pointer state
                window.ftxxPointer.forceCleanupAllPointers();
            }
            
            // Check if a point is within a square's bounds
            isPointInSquare(x, y, squareElement) {
                const squareRect = squareElement.getBoundingClientRect();
                
                return x >= squareRect.left && 
                       x <= squareRect.right &&
                       y >= squareRect.top && 
                       y <= squareRect.bottom;
            }
            
            // Check if a point is near a square (within a certain distance)
            isPointNearSquare(x, y, squareElement, distance) {
                const squareRect = squareElement.getBoundingClientRect();
                const squareCenterX = squareRect.left + squareRect.width / 2;
                const squareCenterY = squareRect.top + squareRect.height / 2;
                
                const pointDistance = Math.sqrt((x - squareCenterX) ** 2 + (y - squareCenterY) ** 2);
                return pointDistance <= distance;
            }
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                window.testApp = new SimpleFTXXTest();
            });
        } else {
            window.testApp = new SimpleFTXXTest();
        }
    </script>
</body>
