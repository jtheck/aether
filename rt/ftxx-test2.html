<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>FTXX Pointer Test</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="testCanvas"></canvas>
    <script src="vendor/ftxx_pointer.js"></script>
    <script>
        const canvas = document.getElementById('testCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // Initialize FTXX Pointer with neutral baseline (all 1.0)
        ftxxPointer.init({ 
            debug: false,
            gestureThresholds: { 
                pan: 1.0,      // Neutral baseline
                rotation: 1.0,  // Neutral baseline
                zoom: 1.0       // Neutral baseline
            },
            gestureSensitivity: {
                pan: 1.0,      // Neutral baseline
                rotation: 1.0,  // Neutral baseline
                zoom: 1.0       // Neutral baseline
            }
        });
        
        // Camera/scroll state
        let camera = { x: 0, y: 0, scale: 1, rotation: 0 };
        let isDragging = false;
        let lastPan = { x: 0, y: 0 };
        
        // Ground/map properties
        const tileSize = 64;
        const mapSize = 50; // Smaller map for better performance
        
        // Game objects
        const units = [
            { x: 100, y: 100, type: 'infantry', color: '#ff6b6b' },
            { x: 200, y: 150, type: 'tank', color: '#4ecdc4' },
            { x: 300, y: 200, type: 'artillery', color: '#45b7d1' },
            { x: 400, y: 250, type: 'infantry', color: '#ff6b6b' },
            { x: 500, y: 300, type: 'tank', color: '#4ecdc4' }
        ];
        
        const buildings = [
            { x: 150, y: 120, type: 'factory', color: '#96ceb4', size: 2 },
            { x: 350, y: 180, type: 'barracks', color: '#feca57', size: 1 },
            { x: 550, y: 220, type: 'command', color: '#ff9ff3', size: 3 },
            { x: 750, y: 280, type: 'factory', color: '#96ceb4', size: 2 }
        ];
        
        // Draw ground grid (simple, no culling)
        function drawGround() {
            ctx.save();
            ctx.translate(camera.x, camera.y);
            ctx.rotate(camera.rotation);
            ctx.scale(camera.scale, camera.scale);
            
            // Draw the entire map
            for (let x = 0; x < mapSize * tileSize; x += tileSize) {
                for (let y = 0; y < mapSize * tileSize; y += tileSize) {
                    const tileX = Math.floor(x / tileSize);
                    const tileY = Math.floor(y / tileSize);
                    
                    // Random green variation based on tile position
                    const seed = (tileX * 73856093) ^ (tileY * 19349663);
                    const random = Math.sin(seed) * 0.5 + 0.5;
                    const green = Math.floor(40 + random * 30);
                    ctx.fillStyle = `#1a${green.toString(16).padStart(2, '0')}1a`;
                    ctx.fillRect(x, y, tileSize, tileSize);
                }
            }
            
            // Draw grid lines
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1;
            
            for (let x = 0; x <= mapSize * tileSize; x += tileSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, mapSize * tileSize);
                ctx.stroke();
            }
            
            for (let y = 0; y <= mapSize * tileSize; y += tileSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(mapSize * tileSize, y);
                ctx.stroke();
            }
            
            // Draw buildings
            buildings.forEach(building => {
                ctx.fillStyle = building.color;
                ctx.fillRect(building.x, building.y, tileSize * building.size, tileSize * building.size);
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.strokeRect(building.x, building.y, tileSize * building.size, tileSize * building.size);
            });
            
            // Draw units
            units.forEach(unit => {
                ctx.fillStyle = unit.color;
                ctx.beginPath();
                ctx.arc(unit.x + tileSize/2, unit.y + tileSize/2, tileSize/3, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
            
            ctx.restore();
        }
        
        // Render loop
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGround();
            requestAnimationFrame(render);
        }
        
        // Handle unified transform events (combines pan, pinch, rotate)
        ftxxPointer.on(canvas, 'transform', (e) => {
        
            // Apply pan directly (normalized: 1.0 = standard sensitivity)
            camera.x += e.deltaX;
            camera.y += e.deltaY;
            
            // Apply scale and rotation around gesture center
            if (e.deltaScale !== 1 || e.deltaRotation !== 0) {
                // Apply scale around gesture center (normalized: 1.0 = standard sensitivity)
                if (e.deltaScale !== 1) {
                    const newScale = Math.max(0.1, Math.min(5, camera.scale * e.deltaScale));
                    const scaleRatio = newScale / camera.scale;
                    
                    camera.x = e.centerX - (e.centerX - camera.x) * scaleRatio;
                    camera.y = e.centerY - (e.centerY - camera.y) * scaleRatio;
                    camera.scale = newScale;
                }
                
                // Apply rotation around gesture center (normalized: 1.0 = standard sensitivity)
                if (e.deltaRotation !== 0) {
                    const cos = Math.cos(e.deltaRotation);
                    const sin = Math.sin(e.deltaRotation);
                    
                    const dx = camera.x - e.centerX;
                    const dy = camera.y - e.centerY;
                    
                    camera.x = e.centerX + dx * cos - dy * sin;
                    camera.y = e.centerY + dx * sin + dy * cos;
                    camera.rotation += e.deltaRotation;
                }
            }
        });
        
        // Set up gesture validation to track gestures on the ground
        ftxxPointer.onGestureStart((gestureData) => {
            // Always track gestures on the ground/map
            return { keep: true, targets: [canvas] };
        });
        
        // Handle mouse drag (only for mouse, not touch)
        ftxxPointer.on(canvas, 'pointerdown', (e) => {
            if (e.isMouse && e.pointers[0].button === 'LMB') {
                isDragging = true;
                lastPan = { x: e.pointers[0].x, y: e.pointers[0].y };
            }
        });
        
        ftxxPointer.on(canvas, 'pointermove', (e) => {
            if (isDragging && e.isMouse) {
                const deltaX = e.pointers[0].x - lastPan.x;
                const deltaY = e.pointers[0].y - lastPan.y;
                
                // Apply rotation to mouse movement
                const cos = Math.cos(-camera.rotation);
                const sin = Math.sin(-camera.rotation);
                const rotatedDeltaX = deltaX * cos - deltaY * sin;
                const rotatedDeltaY = deltaX * sin + deltaY * cos;
                
                camera.x += rotatedDeltaX;
                camera.y += rotatedDeltaY;
                lastPan = { x: e.pointers[0].x, y: e.pointers[0].y };
            }
        });
        
        ftxxPointer.on(canvas, 'pointerup', (e) => {
            if (e.isMouse) {
                isDragging = false;
            }
        });
        
        // Start rendering
        render();
    </script>
</body>
</html>
