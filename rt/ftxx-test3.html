<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTXX Pointer Test 3</title>
    <style>
        .touch-indicator {
            position: fixed;
            width: 40px;
            height: 40px;
            background: rgba(255, 107, 107, 0.8);
            border: 3px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1000;
        }
        
        .touch-label {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        .box {
            position: fixed;
            width: 160px;
            height: 160px;
            background: linear-gradient(45deg, #5352ed, #3742fa);
            border: 3px solid #fff;
            border-radius: 10px;
            transform-origin: center;
            pointer-events: auto;
            z-index: 100;
        }
        
        .box-label {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 4px;
        }
        
        .center-label {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transform-origin: center;
            color: #fff;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 50;
        }
    </style>
</head>
<body>
    <div class="center-label">BEEFY</div>

    <script src="vendor/ftxx_pointer.js"></script>
    <script>
        window.ftxxPointer.init({
            debug: false,
            preventDefault: true,
            passive: false,
            gestureThresholds: {
                pan: 1.0,
                zoom: 1.0,
                rotation: 1.0
            }
        });

        // Tell FTXX when to start tracking gestures
        window.ftxxPointer.onGestureStart((gestureData) => {
            // Check if the gesture started on a box
            const gestureCenter = gestureData.center;
            let targetBox = null;
            let closestBoxId = null;
            let closestDistance = Infinity;
            
            // Find which box (if any) the gesture started on by checking bounds
            for (const [id, box] of boxes) {
                // Box is 160x160px, so bounds are 80px from center in each direction
                const boxLeft = box.x - 80;
                const boxRight = box.x + 80;
                const boxTop = box.y - 80;
                const boxBottom = box.y + 80;
                
                // Check if gesture center is within the box bounds
                if (gestureCenter.x >= boxLeft && gestureCenter.x <= boxRight &&
                    gestureCenter.y >= boxTop && gestureCenter.y <= boxBottom) {
                    targetBox = box.element;
                    closestBoxId = id;
                    closestDistance = 0; // Inside the box
                    break; // Found the box, no need to check others
                }
            }
            
            // Set the targets array with string identifiers (not DOM elements!)
            if (targetBox) {
                gestureData.targets = ['box' + closestBoxId];
            } else {
                gestureData.targets = ['page'];
            }
            
            // Create a new gesture in our tracking system
            const gestureId = Date.now() + Math.random();
            const targetType = targetBox ? 'box' + closestBoxId : 'page';
            const gesture = new Gesture(gestureId, gestureData.touches, targetType);
            gestures.set(gestureId, gesture);
            

            
            return {
                keep: true,  // Always track gestures
                targets: gestureData.targets  // String identifiers: ['box1'], ['page'], etc.
            };
        });

        class Touch {
            constructor(id, x, y) {
                this.id = id;
                this.x = x;
                this.y = y;
                this.element = null;
                this.createVisual();
            }
            
            createVisual() {
                this.element = document.createElement('div');
                this.element.className = 'touch-indicator';
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
                
                const label = document.createElement('div');
                label.className = 'touch-label';
                label.textContent = this.id;
                this.element.appendChild(label);
                
                document.body.appendChild(this.element);
            }
            
            updatePosition(x, y) {
                this.x = x;
                this.y = y;
                if (this.element) {
                    this.element.style.left = x + 'px';
                    this.element.style.top = y + 'px';
                }
            }
            
            remove() {
                if (this.element) {
                    this.element.remove();
                    this.element = null;
                }
            }
        }

        class Gesture {
            constructor(id, touches, target = null) {
                this.id = id;
                this.touches = touches;
                this.target = target; // 'page', 'box1', 'box2', etc.
                this.centerX = 0;
                this.centerY = 0;
                this.calculateCenter();
            }
            
            calculateCenter() {
                if (this.touches.length === 0) return;
                
                let totalX = 0, totalY = 0;
                this.touches.forEach(touch => {
                    totalX += touch.x;
                    totalY += touch.y;
                });
                
                this.centerX = totalX / this.touches.length;
                this.centerY = totalY / this.touches.length;
            }
            
            update() {
                this.calculateCenter();
            }
        }

        class Box {
            constructor(id, x, y) {
                this.id = id;
                this.x = x;
                this.y = y;
                this.rotation = 0;
                this.scale = 1;
                this.element = null;
                this.createVisual();
            }
            
            createVisual() {
                this.element = document.createElement('div');
                this.element.className = 'box';
                this.element.style.left = this.x + 'px';
                this.element.style.top = this.y + 'px';
                
                const label = document.createElement('div');
                label.className = 'box-label';
                label.textContent = `Box ${this.id}`;
                this.element.appendChild(label);
                
                document.body.appendChild(this.element);
                this.updateTransform();
            }
            
            updateTransform() {
                if (this.element) {
                    const transform = `translate(-50%, -50%) rotate(${this.rotation}rad) scale(${this.scale})`;
                    this.element.style.transform = transform;
                }
            }
            
            setPosition(x, y) {
                this.x = x;
                this.y = y;
                if (this.element) {
                    this.element.style.left = x + 'px';
                    this.element.style.top = y + 'px';
                }
            }
            
            setRotation(rotation) {
                this.rotation = rotation;
                this.updateTransform();
            }
            
            setScale(scale) {
                this.scale = scale;
                this.updateTransform();
            }
        }

        const touches = new Map();
        const gestures = new Map();
        const boxes = new Map();

        // Create boxes in each corner
        const boxPositions = [
            { id: 1, x: 100, y: 100 },   // Top-left
            { id: 2, x: window.innerWidth - 100, y: 100 },   // Top-right
            { id: 3, x: 100, y: window.innerHeight - 100 },   // Bottom-left
            { id: 4, x: window.innerWidth - 100, y: window.innerHeight - 100 }   // Bottom-right
        ];

        boxPositions.forEach(pos => {
            const box = new Box(pos.id, pos.x, pos.y);
            boxes.set(pos.id, box);

            
            // Store box reference for manual routing
            box.element.dataset.boxId = box.id;
        });

        window.ftxxPointer.on(window, 'pointerdown', (evt) => {
            evt.pointers.forEach(pointer => {
                const touch = new Touch(pointer.id, pointer.x, pointer.y);
                touches.set(pointer.id, touch);
            });
        });

        window.ftxxPointer.on(window, 'pointerup', (evt) => {
            evt.pointers.forEach(pointer => {
                const touch = touches.get(pointer.id);
                if (touch) {
                    touch.remove();
                    touches.delete(pointer.id);
                }
            });
            
            // Clean up gestures when all touches are gone
            if (touches.size === 0) {
                gestures.clear();

            }
        });

        window.ftxxPointer.on(window, 'pointermove', (evt) => {
            evt.pointers.forEach(pointer => {
                const touch = touches.get(pointer.id);
                if (touch) {
                    touch.updatePosition(pointer.x, pointer.y);
                }
            });
        });

        // Listen for all transform gestures and route them manually
        window.ftxxPointer.on(window, 'transform', (evt) => {
            
            // Update our gesture tracking
            for (const [gestureId, gesture] of gestures) {
                gesture.update();
            }
            
            // Use the targets array to route to the correct gesture
            if (evt.targets && evt.targets.length > 0) {
                const targetId = evt.targets[0]; // String identifier: 'box1', 'page', etc.
                
                if (targetId.startsWith('box')) {
                    // This is a box gesture
                    const boxId = parseInt(targetId.replace('box', ''));
                    const box = boxes.get(boxId);
                    if (box) {

                        
                        // Apply transform to the box
                        console.log(`BOX ${boxId} PAN DATA:`, {
                            deltaX: evt.deltaX,
                            deltaY: evt.deltaY,
                            currentPos: { x: box.x, y: box.y }
                        });
                        if (evt.deltaX !== 0 || evt.deltaY !== 0) {
                            box.setPosition(box.x + evt.deltaX, box.y + evt.deltaY);
                        }
                        if (evt.deltaScale !== 1) {
                            box.setScale(box.scale * evt.deltaScale);
                        }
                        if (evt.deltaRotation !== 0) {
                            box.setRotation(box.rotation + evt.deltaRotation);
                        }
                    }
                } else if (targetId === 'page') {
                    // This is a page gesture (BEEFY)
                    // Reject pan gestures for BEEFY - only allow scale and rotate
                    if (evt.deltaX !== 0 || evt.deltaY !== 0) {
                        return; // Skip pan gestures on BEEFY
                    }
                    
                    // Apply transform to BEEFY
                    const beefyLabel = document.querySelector('.center-label');
                    if (beefyLabel) {
                        // Parse current transform values
                        const scaleMatch = beefyLabel.style.transform.match(/scale\(([^)]+)\)/);
                        const rotationMatch = beefyLabel.style.transform.match(/rotate\(([^)]+)rad\)/);
                        const currentScale = scaleMatch ? parseFloat(scaleMatch[1]) : 1;
                        const currentRotation = rotationMatch ? parseFloat(rotationMatch[1]) : 0;
                        
                        // Calculate new values
                        let newScale = currentScale;
                        let newRotation = currentRotation;
                        
                        if (evt.deltaScale !== 1) {
                            newScale = currentScale * evt.deltaScale;
                        }
                        if (evt.deltaRotation !== 0) {
                            newRotation = currentRotation + evt.deltaRotation;
                        }
                        
                        // Apply both scale and rotation together
                        beefyLabel.style.transform = `translate(-50%, -50%) scale(${newScale}) rotate(${newRotation}rad)`;
                    }
                }
            }
        });
    </script>
</body>
</html>
