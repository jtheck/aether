<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ÆG Forge</title>
  <link rel="icon" href="/icons/favicon-32x32.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1418; color: #ddd; font: 13px/1.4 sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #forge-ui {
      position: absolute; top: 10px; left: 10px; width: 260px;
      max-height: calc(100% - 20px); overflow: auto;
      background: rgba(18, 22, 28, 0.92); border: 1px solid #333; padding: 10px;
    }
    #forge-ui h1 { margin: 0 0 8px; font-size: 16px; }
    #forge-ui label { display: block; margin: 6px 0 2px; color: #aaa; }
    #forge-ui input, #forge-ui select, #forge-ui textarea { width: 100%; box-sizing: border-box; }
    #forge-ui textarea { min-height: 72px; resize: vertical; }
    #forge-ui .block-title { margin: 14px 0 4px; color: #9cc; font-size: 12px; }
    #forge-ui .field-name { display: block; color: #ddd; }
    #forge-ui .field-note { display: block; color: #777; font-size: 11px; font-weight: normal; margin-top: 2px; }
    #forge-ui .faction-row { align-items: center; flex-wrap: nowrap; }
    #forge-ui .faction-swatch { width: 16px; height: 16px; flex: 0 0 auto; border: 1px solid #555; }
    #forge-ui .faction-row select { flex: 1; width: auto; }
    #forge-ui .alliance-name { flex: 1; min-width: 0; }
    #forge-ui .alliance-row select { flex: 0 0 88px; }
    #forge-ui button { margin: 2px 2px 2px 0; }
    .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
    .row button.active { outline: 1px solid #ccc; }
    #campaign-tree { margin: 4px 0; }
    #campaign-tree .row { flex-wrap: nowrap; align-items: center; gap: 2px; margin: 1px 0; }
    #campaign-tree input { flex: 1; min-width: 0; border: 0; background: transparent; color: #ddd; padding: 1px 3px; }
    #campaign-tree input:hover, #campaign-tree input:focus { background: #1c2228; outline: none; }
    #campaign-tree button { margin: 0; padding: 0 5px; }
    #campaign-tree .ep { margin-top: 7px; }
    #campaign-tree .ep input { font-weight: 600; color: #9bb; }
    #campaign-tree .ep.current input { color: #cfe; }
    #campaign-tree .row.off { opacity: 0.55; }
    #campaign-tree .ep.idle input { color: #677; }
    #campaign-tree .num { color: #777; min-width: 15px; text-align: right; }
    /* v1 kakko links — corner brackets, aqua / darkmagenta */
    #forge-ui a.kakko {
      text-decoration: none; color: #fff; white-space: nowrap; font-size: .8em;
    }
    #forge-ui a.kakko:hover { color: aqua; }
    #forge-ui a.kakko:active { color: darkmagenta; }
    #forge-ui a.kakko:visited { color: #fff; }
    #forge-ui a.kakko:before { content: "\300C\000A0"; }
    #forge-ui a.kakko:after { content: "\000A0\300D"; }
    #workshop-publish-dlg {
      display: none;
      position: absolute;
      left: 280px;
      top: 0;
      width: 280px;
      background: rgba(18, 22, 28, 0.94);
      border: 1px solid #333;
      padding: 10px;
      z-index: 8;
    }
    #workshop-publish-dlg.open { display: block; }
    #workshop-publish-dlg img { width: 100%; margin: 6px 0; background: #111; }
    .panel { margin-top: 8px; }
    #forge-view {
      position: absolute;
      top: 10px;
      left: 302px;
      z-index: 4;
      display: flex;
      gap: 14px;
      align-items: center;
      background: rgba(18, 22, 28, 0.92);
      border: 1px solid #333;
      padding: 6px 10px;
    }
    #forge-view label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      color: #ccc;
      white-space: nowrap;
    }
    #forge-view input { width: auto; margin: 0; }
    .hint { color: #888; font-size: 11px; }
    #story-sheet {
      display: none;
      position: absolute;
      left: 280px; right: 10px; bottom: 10px;
      height: 104px;
      background: rgba(18, 22, 28, 0.92);
      border: 1px solid #333;
      padding: 6px 8px 8px;
      z-index: 5;
    }
    #story-sheet.open { display: block; }
    #story-sheet .story-sheet-meta { color: #aaa; font-size: 11px; margin-bottom: 4px; }
    #story-sheet .story-ruler {
      position: relative; height: 10px; margin-bottom: 4px;
      background: #1c2228; cursor: ew-resize;
    }
    #story-sheet .story-tracks {
      display: grid;
      grid-template-columns: 36px 1fr;
      grid-row-gap: 3px;
      align-items: center;
    }
    #story-sheet .story-track-label { color: #888; font-size: 10px; }
    #story-sheet .story-track {
      position: relative; height: 22px;
      background: #151a20; cursor: ew-resize;
    }
    #story-sheet .story-clip {
      position: absolute; top: 2px; bottom: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 10px; padding: 0 4px; margin: 0; border: 0;
      background: #345; color: #eee; cursor: pointer;
    }
    #story-sheet .story-clip.active { outline: 1px solid #ccc; }
    #story-sheet .story-playhead {
      position: absolute; top: 22px; bottom: 8px; width: 1px;
      background: #fc4; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
