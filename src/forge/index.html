<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ÆG Forge</title>
  <link rel="icon" href="/icons/favicon-32x32.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1418; color: #ddd; font: 13px/1.4 sans-serif; }
    #forge-top, #forge-rail, #forge-ui, #workshop-publish-dlg, #story-sheet { user-select: none; }
    #forge-ui input, #forge-ui textarea, #workshop-publish-dlg input, #workshop-publish-dlg textarea { user-select: text; }
    canvas { display: block; width: 100%; height: 100%; }
    #forge-top {
      position: absolute; top: 8px; left: 8px; right: 8px; z-index: 6;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
      background: rgba(18, 22, 28, 0.92); border: 1px solid #333; padding: 6px 10px;
    }
    #forge-top .spacer { flex: 1 1 12px; }
    #forge-top button {
      background: #243038; color: #eee; border: 1px solid #3a4450;
      padding: 3px 8px; cursor: pointer; font: inherit; flex: 0 0 auto;
    }
    #forge-top #btn-chapter {
      background: transparent; border: 0; padding: 0;
      max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #holding { color: #9cc; white-space: nowrap; flex: 0 0 auto; }
    #forge-rail {
      position: absolute; top: 48px; left: 8px; z-index: 5;
      display: flex; flex-direction: column; gap: 2px;
      box-sizing: border-box; max-height: calc(100% - 60px); overflow: auto;
      background: rgba(18, 22, 28, 0.92); border: 1px solid #333; padding: 4px;
    }
    #forge-rail button {
      display: block; width: 64px; margin: 0; text-align: left;
      background: transparent; color: #ccc; border: 0; padding: 6px 8px; cursor: pointer;
    }
    #forge-rail button.active { outline: 1px solid #ccc; color: #fff; }
    #forge-ui {
      display: none;
      position: absolute; top: 48px; left: 84px; width: 260px;
      box-sizing: border-box; max-height: calc(100% - 60px); overflow: auto;
      background: rgba(18, 22, 28, 0.92); border: 1px solid #333; padding: 10px;
    }
    #forge-ui.open { display: block; }
    #forge-ui label { display: block; margin: 6px 0 2px; color: #aaa; }
    #forge-ui input, #forge-ui select, #forge-ui textarea { width: 100%; box-sizing: border-box; }
    #forge-ui label.check { display: flex; align-items: center; gap: 8px; }
    #forge-ui label.check input { width: auto; flex: 0 0 auto; margin: 0; }
    #forge-ui textarea { min-height: 72px; resize: vertical; }
    #forge-ui .block-title { margin: 14px 0 4px; color: #9cc; font-size: 12px; }
    #forge-ui .field-name { display: block; color: #ddd; }
    #forge-ui .field-note { display: block; color: #777; font-size: 11px; font-weight: normal; margin-top: 2px; }
    #forge-ui .faction-row { align-items: center; flex-wrap: nowrap; }
    #forge-ui .faction-swatch { width: 16px; height: 16px; flex: 0 0 auto; border: 1px solid #555; }
    #forge-ui .faction-row select { flex: 1; width: auto; }
    #forge-ui .alliance-name { flex: 1; min-width: 0; }
    #forge-ui .alliance-row select { flex: 0 0 88px; }
    #forge-ui button { margin: 2px 2px 2px 0; }
    #forge-ui .palette {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin: 6px 0;
    }
    #forge-ui .palette button {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      padding: 4px 6px;
      text-align: left;
      background: #1b232b;
      color: #ddd;
      border: 1px solid #333;
    }
    #forge-ui .palette button.active { outline: 1px solid #eee; color: #fff; }
    #forge-ui .swatch {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }
    #forge-ui .ink { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 8px; }
    #forge-ui .ink button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      width: 58px;
      margin: 0;
      padding: 2px 0;
      background: transparent;
      color: #aaa;
      border: 0;
    }
    #forge-ui .ink i {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      display: block;
    }
    #forge-ui .ink button.active { color: #fff; }
    #forge-ui .ink button.active i { border-color: #fff; }
    #forge-ui .side-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 2px 0 6px; }
    #forge-ui .side-row > button { margin: 0; }
    #forge-ui .side-row > .side { flex: 0 0 62px; text-align: left; padding: 2px 4px; }
    #forge-ui .ink.dots { gap: 3px; margin: 0; flex: 1 1 80px; }
    #forge-ui .ink.dots button { width: 22px; padding: 0; }
    #forge-ui .ink.dots i { width: 16px; height: 16px; }
    #forge-ui .side-row > button.active, #forge-ui .row > button.side.active { outline: 1px solid #ccc; }
    #forge-ui .hint, #forge-ui .field-note { display: none; }
    #forge-ui #wall-status, #forge-ui #chunk-note { display: block; }
    #story-clip-list { display: none; }
    .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
    .row button.active { outline: 1px solid #ccc; }
    #campaign-tree { margin: 4px 0; }
    #campaign-tree .row { flex-wrap: nowrap; align-items: center; gap: 2px; margin: 1px 0; }
    #campaign-tree input { flex: 1; min-width: 0; border: 0; background: transparent; color: #ddd; padding: 1px 3px; }
    #campaign-tree input:hover, #campaign-tree input:focus { background: #1c2228; outline: none; }
    #campaign-tree button { margin: 0; padding: 0 5px; }
    #campaign-tree .ep { margin-top: 7px; }
    #campaign-tree .ep input { font-weight: 600; color: #9bb; }
    #campaign-tree .ep.current input { color: #cfe; }
    #campaign-tree .row.off { opacity: 0.55; }
    #campaign-tree .ep.idle input { color: #677; }
    #campaign-tree .num { color: #777; min-width: 15px; text-align: right; }
    /* v1 kakko links - corner brackets, aqua / darkmagenta */
    #forge-ui a.kakko {
      text-decoration: none; color: #fff; white-space: nowrap; font-size: .8em;
    }
    #forge-ui a.kakko:hover { color: aqua; }
    #forge-ui a.kakko:active { color: darkmagenta; }
    #forge-ui a.kakko:visited { color: #fff; }
    #forge-ui a.kakko:before { content: "\300C\000A0"; }
    #forge-ui a.kakko:after { content: "\000A0\300D"; }
    #workshop-publish-dlg {
      display: none;
      position: absolute;
      left: 84px;
      top: 48px;
      width: 280px;
      box-sizing: border-box;
      max-height: calc(100% - 60px);
      overflow: auto;
      background: rgba(18, 22, 28, 0.94);
      border: 1px solid #333;
      padding: 10px;
      z-index: 8;
    }
    #workshop-publish-dlg label { display: block; margin: 6px 0 2px; color: #aaa; }
    #workshop-publish-dlg input, #workshop-publish-dlg textarea { width: 100%; box-sizing: border-box; }
    #workshop-publish-dlg.open { display: block; }
    #workshop-publish-dlg img { width: 100%; margin: 6px 0; background: #111; }
    .panel { margin-top: 8px; }
    #forge-view {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      align-items: center;
      flex: 1 1 auto;
      max-width: 100%;
      min-width: 0;
    }
    #forge-view label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      color: #ccc;
      white-space: nowrap;
    }
    #forge-view input { width: auto; margin: 0; }
    .hint { color: #888; font-size: 11px; }
    #story-sheet {
      display: none;
      position: absolute;
      left: 84px; right: 10px; bottom: 10px;
      height: 104px;
      background: rgba(18, 22, 28, 0.92);
      border: 1px solid #333;
      padding: 6px 8px 8px;
      z-index: 5;
    }
    #story-sheet.open { display: block; }
    #story-sheet .story-sheet-meta { color: #aaa; font-size: 11px; margin-bottom: 4px; }
    #story-sheet .story-ruler {
      position: relative; height: 10px; margin-bottom: 4px;
      background: #1c2228; cursor: ew-resize;
    }
    #story-sheet .story-tracks {
      display: grid;
      grid-template-columns: 36px 1fr;
      grid-row-gap: 3px;
      align-items: center;
    }
    #story-sheet .story-track-label { color: #888; font-size: 10px; }
    #story-sheet .story-track {
      position: relative; height: 22px;
      background: #151a20; cursor: ew-resize;
    }
    #story-sheet .story-clip {
      position: absolute; top: 2px; bottom: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 10px; padding: 0 4px; margin: 0; border: 0;
      background: #345; color: #eee; cursor: grab; touch-action: none;
    }
    #story-sheet .story-clip.active { outline: 1px solid #ccc; }
    #story-sheet .story-playhead {
      position: absolute; top: 22px; bottom: 8px; width: 1px;
      background: #fc4; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
