<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ÆG Forge</title>
  <link rel="icon" href="/icons/favicon-32x32.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1418; color: #ddd; font: 13px/1.4 sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #forge-ui {
      position: absolute; top: 10px; left: 10px; width: 260px;
      background: rgba(18, 22, 28, 0.92); border: 1px solid #333; padding: 10px;
    }
    #forge-ui h1 { margin: 0 0 8px; font-size: 16px; }
    #forge-ui label { display: block; margin: 6px 0 2px; color: #aaa; }
    #forge-ui input, #forge-ui select { width: 100%; box-sizing: border-box; }
    #forge-ui button { margin: 2px 2px 2px 0; }
    .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
    .row button.active { outline: 1px solid #ccc; }
    .panel { margin-top: 8px; }
    .hint { color: #888; font-size: 11px; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
